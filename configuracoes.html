<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Configurações </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="caixa-login">
        <h2> Configurações </h2>
        <p style="text-align: center; margin-bottom: 20px;"> Ajuste de acessibilidade</p>

        <button type="button" class="btn-menu" onclick="alternarModoClaro()"> Modo Claro </button>
        <button type="button" class="btn-menu" onclick="alternarFonteGrande()"> Letras Maiores </button>

        <a href="menu.html" class="link-esqueci" style="text-align: center; margin-top: 20px;"> Voltar ao menu </a>
    </div>

    <script> 
        function alternarModoClaro(){
            document.body.classList.toggle('modo-claro');
        }

        function alternarFonteGrande(){
            document.body.classList.toggle('fonte-grande');
        }

    </script>
</body>
</html>
